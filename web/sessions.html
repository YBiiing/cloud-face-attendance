<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程签到管理</title><link rel="stylesheet" href="/assets/styles.css"><script type="module" src="/assets/sessions.js"></script></head>
<body><main><nav><a href="/">首页</a><a href="/login.html">账户</a></nav><h1>课程签到管理</h1><p>创建时固定本班已激活学生名单。发布后可提前结束，不能修改名单或时间。</p><p id="message" role="status"></p><div id="admin-area" hidden>
<form id="class-form"><h2>创建班级</h2><label>班级名称<input name="name" required maxlength="100"></label><button>创建班级</button></form>
<form id="session-form"><h2>发布签到场次</h2><label>课程 / 场次名称<input name="title" required maxlength="100"></label><label>选择班级<select name="class_id" required></select></label><label>开始时间<input name="starts_at" type="datetime-local" required></label><label>结束时间<input name="ends_at" type="datetime-local" required></label><p class="hint">时间按当前设备时区输入，提交时转换为带时区时间。</p><button>创建签到场次</button></form>
<h2>已发布场次</h2><div id="session-list"></div><div class="pager"><button id="previous">上一页</button><span id="page-info"></span><button id="next">下一页</button></div></div></main></body></html>
