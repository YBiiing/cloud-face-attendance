<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>照片库 · 课程人脸签到</title><link rel="stylesheet" href="/assets/styles.css"><script type="module" src="/assets/faces.js"></script></head>
<body><main><nav data-workspace-nav aria-label="主要导航"></nav><h1>标准照片库</h1><p>保存清晰的本人照片，供课程签到识别。删除最后一张标准照后，将无法人脸签到。</p><label id="people-label" hidden>选择人员<select id="people"></select></label>
<p id="message" role="status"></p><div id="photo-list"></div><div class="pager"><button id="previous" type="button">上一页</button><span id="page-info"></span><button id="next" type="button">下一页</button></div>
<form id="face-form" hidden><h2 id="upload-title">新增标准照</h2><div class="photo-picker"><label class="photo-choice">从相册选择<input class="visually-hidden" name="photo" type="file" accept="image/jpeg,image/png" required></label><button type="button" class="secondary" data-camera>拍照</button><input type="file" accept="image/jpeg,image/png" capture="user" data-camera-input hidden><p class="hint" data-photo-name>尚未选择照片</p></div><img class="preview" id="preview" alt="待上传照片" hidden><button>上传照片</button><button type="button" id="cancel-replace" hidden>取消替换</button></form></main></body></html>
