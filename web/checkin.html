<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程签到</title><link rel="stylesheet" href="/assets/styles.css"><script type="module" src="/assets/checkin.js"></script></head>
<body><main><nav><a href="/">首页</a><a href="/records.html">我的签到记录</a></nav>
<h1 id="title">课程签到</h1><section><p id="details">正在读取场次……</p><p id="countdown" class="hint"></p><button id="refresh" type="button">刷新场次状态</button></section>
<p>无需登录。请拍摄本人清晰正面照，服务器会识别身份并核对本场次名单。</p>
<form id="checkin-form" hidden><label>签到照片<input name="photo" type="file" accept="image/jpeg,image/png" capture="user" required></label><p class="hint">仅支持 JPEG/PNG，最大 8 MiB。照片中只能有一人。</p><img id="preview" class="preview" alt="签到照片预览" hidden><button id="submit">上传并签到</button></form>
<p id="message" role="status"></p><button id="resume" type="button" hidden>继续查询签到结果</button>
</main></body></html>
