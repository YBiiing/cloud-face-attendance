<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>创建签到</title><link rel="stylesheet" href="/assets/styles.css"><script type="module" src="/assets/session-create.js"></script></head><body><main><nav data-workspace-nav aria-label="主要导航"></nav><p class="eyebrow">老师 · 发布课程签到</p><h1>创建签到</h1><p>选择班级与时间，发布后学生即可在自己的待签到列表中查看。</p><p id="message" role="status"></p><div id="admin-area" hidden><form id="session-form"><label>课程名称<input name="title" required maxlength="100" placeholder="例如：云计算 · 第三次课"></label><label>签到班级<select name="class_id" required></select></label><div class="field-grid"><label>开始时间<input name="starts_at" type="datetime-local" required></label><label>结束时间<input name="ends_at" type="datetime-local" required></label></div><p class="hint">使用本机时间。名单为创建时本班已完成录入的学生；请先确认学生已注册。发布后可提前结束，不能修改名单或时间。</p><div class="toolbar"><button type="submit">发布签到</button><a href="/sessions.html">取消，返回场次列表</a></div></form><details><summary>还没有班级？创建班级</summary><form id="class-form"><label>班级名称<input name="name" required maxlength="100" placeholder="例如：计算机 2401 班"></label><button>创建班级</button><p class="hint">创建班级后，学生需选择该班级并完成注册录入，才能发布签到。</p></form></details></div></main></body></html>
