<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册 · 课程人脸签到</title><link rel="stylesheet" href="/assets/styles.css"><script type="module" src="/assets/register.js"></script></head>
<body><main><nav><a href="/">首页</a><a href="/login.html">登录</a></nav><h1>注册并录入人脸</h1><p>请上传本人清晰正面照，确保照片中只有一张人脸。完成录入后才能登录。</p>
<form id="register-form"><label>姓名<input name="name" required maxlength="50" autocomplete="name"></label><label>学号<input name="student_no" required pattern="[A-Za-z0-9]{1,32}" maxlength="32" autocomplete="username"></label><label>班级<select name="class_id" required><option value="">正在加载班级……</option></select></label><label>密码<input name="password" type="password" required minlength="6" maxlength="128" autocomplete="new-password" placeholder="至少 6 位字符"></label><div class="photo-picker"><label>从相册选择<input name="photo" type="file" accept="image/jpeg,image/png" required></label><button type="button" class="secondary" data-camera>拍照</button><input type="file" accept="image/jpeg,image/png" capture="user" data-camera-input hidden><p class="hint" data-photo-name>尚未选择照片</p></div><p class="hint">支持 JPEG/PNG，最大 8 MiB。请自愿提供本人照片。</p><img id="preview" class="preview" alt="待上传照片预览" hidden><button id="submit">提交注册</button></form><p id="message" role="status"></p></main></body></html>
