<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>登录 · 课程签到</title><link rel="stylesheet" href="/assets/styles.css"><script type="module" src="/assets/login.js"></script></head>
<body><main class="auth-page"><nav><a href="/">课程签到</a></nav><p class="eyebrow">欢迎回来</p><h1>登录你的账户</h1><p class="hint">学生查看待签到课程，老师管理课程签到。</p>
<form id="login-form"><label>学号 / 老师账号<input name="student_no" required maxlength="32" autocomplete="username" placeholder="请输入学号或老师账号"></label><label>密码<input name="password" type="password" required minlength="6" maxlength="128" autocomplete="current-password" placeholder="至少 6 位字符"></label><label class="inline-label"><input id="show-password" type="checkbox">显示密码</label><button type="submit">登录</button></form><p id="message" role="status" aria-live="polite"></p><p>还没有学生账号？ <a href="/register.html">注册并录入人脸</a></p><p class="hint">老师账号由系统维护人员开通。</p></main></body></html>
