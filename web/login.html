<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 课程人脸签到</title><link rel="stylesheet" href="/assets/styles.css"><script type="module" src="/assets/login.js"></script></head>
<body><main><nav><a href="/">首页</a><a href="/register.html">注册录入</a></nav><h1>登录</h1><p>登录后管理标准照片、查看签到记录。</p>
