<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课程人脸签到</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/home.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">课程人脸签到</p>
    <h1>每一次课程，单独签到。</h1>
    <p>学生打开课程签到链接，拍照后查看结果。管理员可创建班级签到并查看记录。</p>
    <section aria-labelledby="status-title">
      <h2 id="status-title">开发进度</h2>
      <p>当前已建立页面和服务入口，注册与签到功能正在开发。</p>
      <p id="service-status" role="status">正在检查服务连接……</p>
      <p class="hint">连接检查仅表示 API 可访问，不代表人脸识别已可用。</p>
    </section>
    <a href="/api/docs">查看已实现的接口</a>
  </main>
</body>
</html>
